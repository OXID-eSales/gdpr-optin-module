name: Auto trigger on push or pull requests

on:
  pull_request: {}
  push:
    branches:
      - 'b-7.6.x**'

jobs:
  php84_mysql80:
    uses: oxid-eSales/github-actions/.github/workflows/universal_workflow_light.yaml@v5
    with:
      testplan: '~/defaults/7.6.x.yaml,~/defaults/php8.4_mysql8.0_only.yaml,~/module-gdproptin.yaml,~/_custom.yaml'
      runs_on: '"ubuntu-latest"'
      defaults: 'v5'
      plan_folder: '.github/oxid-esales'
      custom_testplan_yaml: |
        finish:
          slack_title: 'PHP84-MySQL80-{{ .Github.EventName }}-{{ .Github.RefName }}'
    secrets:
      DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
      CACHE_ACCESS_KEY: ${{ secrets.CACHE_ACCESS_KEY }}
      CACHE_SECRET_KEY: ${{ secrets.CACHE_SECRET_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # EE runs only on push (never on pull_request): the public repo cannot run EE
  # itself, so it dispatches the EE test into the private module-workflows repo.
  push_module_ee:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger EE workflow and wait for results
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: oxid-esales
          repo: module-workflows
          github_user: ${{ secrets.CI_USER }}
          github_token: ${{ secrets.GH_CI_JENKINS_TOKEN }}
          workflow_file_name: gdproptin_workflow.yaml
          ref: "b-7.6.x"
          client_payload: "{\"edition\": \"ee\", \"ref\": \"${{ github.ref_name }}\"}"
