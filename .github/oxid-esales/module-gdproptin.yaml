install:
  cache:
    prepared_shop: false
  git:
    repository: 'OXID-eSales/gdpr-optin-module'
    ref: &ref '{{ .Github.RefName }}'
    shop_url: 'https://github.com/OXID-eSales/gdpr-optin-module.git'
    shop_ref: *ref
  composer:
    root_url: ''
    transform: |
      {
          "require": {
              "oxid-esales/oxideshop-ce": "v7.3.0",
              "oxid-esales/twig-admin-theme": "v2.6.0",
              "oxid-esales/twig-component": "v2.6.0",
              "oxid-esales/apex-theme": "v2.1.0"
          }
      }
  custom_script_container: |
    vendor/bin/oe-console oe:database:reset --db-host=mysql --db-port=3306 --db-name=example --db-user=root --db-password=root --force
    vendor/bin/oe-console oe:module:install ./
    vendor/bin/oe-console oe:module:activate oegdproptin
    vendor/bin/oe-console oe:theme:activate apex

install_shop_with_modules:
  composer:
    root_url: ''

runscript: &runscript
  matrix:
    script: |
      [
        "oegdproptin:phpunit-clover",
        "oegdproptin:codeception"
      ]
  oegdproptin:
    path: ''

runslim:
  <<: *runscript
  matrix:
    script: |
      [
        "oegdproptin:phpstan",
        "oegdproptin:phpmd",
        "oegdproptin:phpcs",
      ]

sonarcloud:
  matrix:
    testplan: '["-"]'
  strip_path: '/var/www/'
  project_name: 'oxid-esales/gdpr-optin-module'
  project_key: 'OXID-eSales_gdpr-optin-module'
  organization: 'oxid-esales'
  parameters: |
    -Dsonar.language=php \
    -Dsonar.scm.provider=git \
    -Dsonar.sources=src \
    -Dsonar.tests=tests \
    -Dsonar.php.phpstan.reportPaths=coverage-reports/phpstan.report.json

finish:
  slack_title: 'Module gdpr opt in ({{ .Data.global.git.shop_ref }}) by {{ .Github.Actor }}'